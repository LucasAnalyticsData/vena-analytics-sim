name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  # Deploy desativado de proposito: exigiria uma Service Account key como
  # secret do GitHub (pratica desencorajada em 2026) ou Workload Identity
  # Federation entre GitHub Actions e GCP (sem chave armazenada). Fica
  # documentado como proximo passo — nao implementado aqui pra nao publicar
  # um pipeline de deploy pela metade.